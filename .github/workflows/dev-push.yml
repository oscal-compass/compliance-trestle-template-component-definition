name: Push to develop
on:
  push:
    branches:
      - develop
jobs:
  auto-content-update:
    name: Autoupdate content
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 2
        # GIT_TOKEN (PAT) is used in configured instance repos for private repo access and push auth.
        # Fallback to github.token allows the template repo itself to pass checkout without a secret set.
        token: ${{ secrets.GIT_TOKEN || github.token }}
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Install Trestle
      run: bash scripts/automation/install_trestle.sh
    - name: Automatically update content on push
      run: bash scripts/automation/check_and_update_all.sh
    - name: Push the changes
      run: bash scripts/automation/push.sh
  
